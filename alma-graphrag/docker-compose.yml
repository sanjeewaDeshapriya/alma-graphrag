services:
  neo4j:
    image: neo4j:5.18.0
    container_name: alma_neo4j
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (Python connection)
    environment:
      - NEO4J_AUTH=neo4j/alma_password123
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: alma_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: alma_pgvector
    ports:
      # Host 5433 avoids clashing with a native Postgres already bound to 5432.
      - "5433:5432"
    environment:
      # Override via .env in production; defaults keep local dev zero-config.
      - POSTGRES_USER=${PG_USER:-alma}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-alma_password123}
      - POSTGRES_DB=${PG_DB:-alma_vectors}
    volumes:
      - ./pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped
